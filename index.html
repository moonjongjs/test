<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="author" content="Moon Seon Jong">
  <meta name="description" content="제네시스 풀스크린 자동재생 이미지 캐러셀 프로젝트">
  <title>GENESIS | Fullscreen Carousel</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="carousel" id="carousel" aria-label="제네시스 메인 슬라이드">
    <div class="track" id="track"></div>

    <button class="nav prev" id="prevBtn" aria-label="이전 슬라이드">&#10094;</button>
    <button class="nav next" id="nextBtn" aria-label="다음 슬라이드">&#10095;</button>

    <div class="status" aria-live="polite">
      <span id="current">01</span><span class="divider">/</span><span>08</span>
    </div>
    <div class="progress"><span id="progressBar"></span></div>
  </main>

  <script src="./js/script.js"></script>
</body>
</html>
