<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Moon Seon Jong">
  <title>GENESIS | Landing</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/landing.css">
</head>
<body>
  <header class="hero" id="top">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <span class="brand">GENESIS</span>
      <h1 id="modelTitle">GENESIS</h1>
      <p id="modelSub">Luxury in motion</p>
      <a class="scroll-down" href="#specs">SCROLL ↓</a>
    </div>
  </header>

  <main>
    <section class="section intro reveal" id="specs">
      <div class="inner two-col">
        <div>
          <p class="kicker">SPECIFICATIONS</p>
          <h2>정제된 성능과<br>프리미엄 감성</h2>
        </div>
        <div class="spec-grid" id="specGrid"></div>
      </div>
    </section>

    <section class="parallax-section reveal" id="parallaxSection">
      <div class="parallax-image" id="parallaxImage"></div>
      <div class="parallax-copy">
        <span>ATHLETIC ELEGANCE</span>
        <h2>움직임까지 디자인하다</h2>
      </div>
    </section>

    <section class="section price reveal">
      <div class="inner price-card">
        <div>
          <p class="kicker">PRICE</p>
          <h2>가격 안내</h2>
          <p class="note">교육용 데모 프로젝트의 예시 가격/제원입니다.</p>
        </div>
        <strong id="modelPrice">₩ 0</strong>
      </div>
    </section>

    <section class="section actions reveal">
      <div class="inner action-row">
        <a class="back-btn" href="./index.html">← 메인 슬라이드로 돌아가기</a>
        <a class="top-link" href="#top">TOP</a>
      </div>
    </section>
  </main>

  <button id="goTop" class="go-top" aria-label="맨 위로 이동">↑</button>

  <script src="./js/landing.js"></script>
</body>
</html>
